name: Release

on:
    workflow_run:
        workflows: ['Tag']
        types: [completed]
        branches: [main]
    workflow_dispatch:
        inputs:
            tag:
                description: Tag to release (for example, v0.2.0)
                required: true
                type: string

permissions:
    contents: write
    packages: write

jobs:
    prepare:
        if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-latest

        outputs:
            should_release: ${{ steps.release.outputs.should_release }}
            tag: ${{ steps.release.outputs.tag }}

        steps:
            - name: Check out source commit
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.workflow_run.head_sha || 'main' }}
                  fetch-depth: 0

            - name: Determine release tag
              id: release
              env:
                  GH_TOKEN: ${{ github.token }}
                  MANUAL_TAG: ${{ inputs.tag }}
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    TAG="$MANUAL_TAG"
                  else
                    TAG="v$(node -p "require('./package.json').version")"
                  fi

                  echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

                  if ! git rev-parse --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
                    echo "Tag ${TAG} does not exist"
                    echo "should_release=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  if gh release view "$TAG" >/dev/null 2>&1; then
                    echo "Release ${TAG} already exists"
                    echo "should_release=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  echo "should_release=true" >> "$GITHUB_OUTPUT"

    release:
        needs: prepare
        if: needs.prepare.outputs.should_release == 'true'
        runs-on: ubuntu-latest

        steps:
            - name: Check out release tag
              uses: actions/checkout@v7
              with:
                  ref: ${{ needs.prepare.outputs.tag }}
                  fetch-depth: 0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
                      type=raw,value=latest

            - name: Build and push Docker image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max,ignore-error=true

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ needs.prepare.outputs.tag }}
                  draft: true
                  generate_release_notes: true
